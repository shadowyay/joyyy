<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Span Example</title>
  <style>
    .highlight {
      color: crimson;
      font-weight: bold;
      background-color: #ffe0e0;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Using the &lt;span&gt; Tag</h2>

  <p>
    This is a normal sentence, but <span class="highlight">this part is special</span> because it's styled with CSS.
  </p>

  <p>
    <span id="clickable">Click me!</span>
  </p>

  <script>
    const span = document.getElementById("clickable");
    span.style.cursor = "pointer";
    span.style.color = "blue";
    span.onclick = () => {
      alert("You clicked the span!");
    };
  </script>

</body>
</html>
